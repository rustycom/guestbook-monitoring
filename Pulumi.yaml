name: guestbook-monitoring
runtime: nodejs
description: Kubernetes Guestbook (pulumi/examples) extended with Prometheus + Grafana monitoring
# Non-secret configuration lives here (project level) rather than in Pulumi.dev.yaml, because the
# stack file also carries the passphrase-bound encryption salt and so cannot be shared.
# Override per stack with `pulumi config set <key> <value>`.
config:
  kubeContext:
    type: string
    description: Kube context to deploy to. Always explicit; the ambient current-context is never used.
    default: kind-guestbook-monitoring
  frontendServiceType:
    type: string
    description: Service type of the guestbook frontend (traffic enters via Traefik, so ClusterIP).
    default: ClusterIP
  exposeAs:
    type: string
    description: How Grafana and the Traefik edge are exposed - NodePort (kind) or LoadBalancer (cloud).
    default: NodePort
  nodeHost:
    type: string
    description: Host used to build NodePort URLs in stack outputs.
    default: localhost
  skipLbAwait:
    type: boolean
    description: With exposeAs=LoadBalancer, don't wait for an external address (useful on kind).
    default: false
