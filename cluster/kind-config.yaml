    # Default node image of kind v0.32.0 (digest-pinned as the kind release notes require).
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    extraPortMappings:
      - { containerPort: 30080, hostPort: 30080, protocol: TCP }  # guestbook via Traefik
      - { containerPort: 30300, hostPort: 30300, protocol: TCP }  # Grafana
